[workspace]
authors = ["bpmeyer <briana90@uw.edu>"]
channels = ["conda-forge"]
name = "GLIMPSE"
platforms = ["linux-64","osx-arm64"]
version = "0.1.0"

[tasks]
recon-all-parallel = "python recon_all_parallel.py"
freesurfer-qa = "python freesurfer_qa.py"
segment-pvs = "python segment_pvs.py"
heudiconv-osa = "bash OSA/run_heudiconv_osa.sh"
download-xnat = "python downloadxnat.py"

[dependencies]
python = ">=3.10"
pydicom = ">=2.3"
numpy = "*"
nibabel = "*"
xnat = "*"
