[workspace]
authors = ["bpmeyer <briana90@uw.edu>"]
channels = ["conda-forge"]
name = "GLIMPSE"
platforms = ["linux-64","osx-arm64"]
version = "0.1.0"

[tasks]
recon-all-parallel = "python recon_all_parallel.py"
freesurfer-qa = "python freesurfer_qa.py"
segment-pvs = "python segment_pvs.py"
segment-pvs-drips = "python segment_pvs_drips.py"
anat-masks = "python anat_masks.py"
pvs-volumes = "python pvs_volumes.py"
pvs-reproducibility = "python pvs_reproducibility.py"
heudiconv = "bash run_heudiconv.sh"
qsiprep = "bash WISP/run_qsiprep.sh"
fmriprep = "bash fmriprep_apptainer.sh"
philips-bids = { cmd = "apptainer exec --bind /mnt/cina /mnt/cina/lib/heudiconv_latest.sif python update_philips_BIDs.py {{ project }} --nifti-subdir {{ nifti_subdir }}{% if subjects %} --subjects {{ subjects }}{% endif %}", args = [
    "project",
    { arg = "nifti_subdir", default = "nifti" },
    { arg = "subjects", default = "" },
] }
download-xnat = "python downloadxnat.py"

[dependencies]
python = ">=3.10"
pydicom = ">=2.3"
numpy = ">=2.0"
nibabel = "*"
scipy = "*"
xnat = "*"
pandas = "*"
